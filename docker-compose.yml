# Local development.
#   docker compose up -d db     -> only PostgreSQL (run the backend from the IDE / ./mvnw)
#   docker compose up -d        -> PostgreSQL + the backend container on :8080
services:
  db:
    image: postgres:17-alpine
    container_name: liftlog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Host port 5433 so it never clashes with a locally installed PostgreSQL on 5432
      - "${DB_PORT:-5433}:5432"
    volumes:
      - liftlog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: liftlog-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reachable by its service name on 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  liftlog-db-data:
