services:
  db:
    image: postgres:17-alpine
    container_name: liftlog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Host port 5433 so it never clashes with a locally installed PostgreSQL on 5432
      - "${DB_PORT:-5433}:5432"
    volumes:
      - liftlog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  liftlog-db-data:
