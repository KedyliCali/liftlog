spring:
  application:
    name: liftlog
  config:
    # Load DB credentials from the repo-root .env (works when started from backend/ or the root).
    # "optional:" so a deployed container can rely on real environment variables instead.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:liftlog}
    username: ${DB_USER:liftlog}
    password: ${DB_PASSWORD}
    hikari:
      # Small pool: free hosted PostgreSQL plans allow few connections
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Neon suspends idle databases and drops their connections; recycle ours before that happens
      idle-timeout: 120000
      max-lifetime: 240000
      keepalive-time: 60000
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  web:
    # API messages stay English regardless of the server machine's OS language
    locale: en
    locale-resolver: fixed

server:
  # Hosting platforms such as Render tell the app which port to listen on via PORT
  port: ${PORT:8080}

liftlog:
  cors:
    # Comma-separated web app origins allowed to call the API from a browser
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  riot:
    # Personal key from developer.riotgames.com; empty leaves the League tracker switched off
    api-key: ${RIOT_API_KEY:}
    # Local development only: generated League data, no key needed
    fake: ${RIOT_FAKE:false}
    # First day of the current ranked season; the season peak rank only counts snapshots from then on
    season-start: ${LOL_SEASON_START:2026-01-08}
  rate-limit:
    auth:
      # Per client IP, shared by login, register and the passkey sign-in endpoints
      requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}
      # Clients tracked at once; bounds the limiter's memory
      max-clients: 10000
  passkey:
    # Empty: the host of the first allowed origin
    rp-id: ${PASSKEY_RP_ID:}
    # Unexpired anonymous sign-in ceremonies allowed at once, across all clients
    max-live-login-ceremonies: 500
  jwt:
    # Required; at least 32 bytes. Set via JWT_SECRET in .env (local) or the server environment.
    secret: ${JWT_SECRET}
    ttl: 30d
