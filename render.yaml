# Render Blueprint: Render reads this file and creates the services from it.
# The database lives on Neon (free PostgreSQL that does not expire); its connection details are
# entered once in the Render dashboard and never committed.
services:
  - type: web
    name: liftlog-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Android-only or docs-only commits should not redeploy the API
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Random 256-bit value generated by Render on first deploy
      - key: JWT_SECRET
        generateValue: true
      # e.g. jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # The web app's address, e.g. https://liftlog-web.onrender.com (lets browsers call the API)
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # The web app (installable on iPhone). Static sites on the free plan never sleep.
  - type: web
    name: liftlog-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths:
        - web/**
    # Client-side routing: every path serves index.html and React Router picks the page
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The API's address, e.g. https://liftlog-api.onrender.com (baked in at build time)
      - key: VITE_API_URL
        sync: false
